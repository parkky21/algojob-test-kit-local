; Runs all 8 AlgoJob services in one container.
;
; Two things this file is deliberately careful about:
;
;  1. ENV ISOLATION. A single container means a single process environment, so
;     any var set globally leaks into every service. All three runtimes here
;     (@nestjs/config, @next/env, python-dotenv) give real env vars precedence
;     over .env files, which makes each program's `environment=` a reliable
;     per-service override layer. Two vars MUST stay scoped:
;       - PORT      : read by BOTH nest and Next.js standalone. A global PORT
;                     would make the frontend try to bind nest's port. nest is
;                     given NEST_PORT (which it prefers over PORT) and only the
;                     frontend gets PORT.
;       - ENABLE_CRON_JOB : genuinely differs (apex false, personalized true)
;                     and personalized DEFAULTS TO TRUE when unset, so it can't
;                     simply be left out.
;
;  2. CWD. Every service's .env loading is relative, so `directory=` is what
;     makes each one read its own .env. Secrets are not baked into the image —
;     docker-compose mounts each .env into these directories at runtime.
;
; Logs go to the container's stdout so `docker compose logs` shows everything,
; prefixed by program name.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


; ---------------------------------------------------------------- livekit ---
; Started first: agent_server registers against it, and the frontend's browser
; clients connect to it directly.
[program:livekit]
directory=/app/livekit
command=/usr/local/bin/livekit-server --config /app/livekit/livekit.yaml
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; NOTE: algojob-proctoring-mise is not part of this image — its mediapipe
; dependency has no Linux ARM64 wheel and was the only thing forcing the build
; to x86_64. Services keep their PROCTOR_API_URL pointing at localhost:8080,
; which simply won't answer; proctoring is opt-in per interview
; (`proctoring_enabled` job metadata), so non-proctored interviews are
; unaffected. See the note in the Dockerfile's py-build stage to restore it.


; --------------------------------------------------------- algojobs_service ---
[program:algojobs_service]
directory=/app/algojobs_service
command=/app/algojobs_service/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
priority=30
autorestart=true
startsecs=5
environment=LOG_LEVEL="INFO"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; ------------------------------------------------------------------- apex ---
; Port is given explicitly: apex's own Dockerfile CMD hardcodes 8000, which
; collides with algojobs_service. 8001 is what nest's ALGOAPEX_API_URL expects.
; ENABLE_CRON_JOB=false — the daily full pass fires paid LLM question
; generation; run it on demand instead (scripts/run_worker.sh cron --now).
; RUN_CONSUMERS=true means this one process also hosts the SQS consumers, so no
; separate worker programs are needed.
[program:apex]
directory=/app/apex
command=/app/apex/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8001
priority=30
autorestart=true
startsecs=5
environment=LOG_LEVEL="INFO",ENABLE_CRON_JOB="false",RUN_CONSUMERS="true"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; ----------------------------------------------------------- personalized ---
; ENABLE_CRON_JOB is set explicitly rather than inherited: this service
; defaults it to TRUE when unset, unlike apex.
[program:personalized]
directory=/app/personalized
command=/app/personalized/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8070
priority=30
autorestart=true
startsecs=5
environment=LOG_LEVEL="INFO",ENABLE_CRON_JOB="true"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; ------------------------------------------------------------------- nest ---
; NEST_PORT (not PORT) — nest prefers NEST_PORT, and leaving PORT unset here
; keeps it from colliding with the frontend.
[program:nest]
directory=/app/nest
command=/usr/local/bin/node dist/main
priority=40
autorestart=true
startsecs=5
; NODE_ENV comes from NEST_NODE_ENV (default "production"). nest's
; validateConfig refuses to boot in production when LOCAL_AUTH_JWT_SECRET /
; SESSION_SECRET / PROVIDER_KEY_SECRET / API_KEY_ENCRYPTION_SECRET are missing
; or still set to "change-me-in-production" — that check is intentional, so a
; real deploy must supply real secrets in algojob_nest/.env. The macOS smoke
; test sets NEST_NODE_ENV=development to bypass it without weakening the
; production path.
environment=NODE_ENV="%(ENV_NEST_NODE_ENV)s",NEST_PORT="5001",TLS_CA_FILE="/app/global-bundle.pem"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; --------------------------------------------------------------- frontend ---
; PORT is scoped to this program only (see the header note).
; API_BASE_URL / LIVEKIT_URL / LIVEKIT_DEBUG are consumed by frontend-entry.sh,
; which rewrites the __TOKEN__ placeholders baked into the built JS. They are
; browser-resolved, so they come from the PUBLIC_* container env and must point
; at the server's public hostname on a real deploy.
; BACKEND_API_URL is server-side (inside this container) and stays on localhost.
[program:frontend]
directory=/app/frontend
command=/usr/local/bin/frontend-entry.sh
priority=50
autorestart=true
startsecs=5
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",BACKEND_API_URL="http://localhost:5001",API_BASE_URL="%(ENV_PUBLIC_API_BASE_URL)s",LIVEKIT_URL="%(ENV_PUBLIC_LIVEKIT_URL)s",LIVEKIT_DEBUG="%(ENV_PUBLIC_LIVEKIT_DEBUG)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; ----------------------------------------------------------- agent_server ---
; Outbound LiveKit worker — binds no port. Started last so livekit and
; proctoring are already listening; it retries regardless.
[program:agent_server]
directory=/app/agent_server
command=/app/agent_server/.venv/bin/python main.py start
priority=60
autorestart=true
startsecs=10
environment=LOG_LEVEL="INFO",DOCDB_CA_BUNDLE="/app/global-bundle.pem",XDG_CACHE_HOME="/app/agent_server/.cache"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
