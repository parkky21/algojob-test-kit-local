services:
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    ports:
      - '6379:6379'
    volumes:
      - livekit_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  livekit_redis_data:
    driver: local
