# Linux-only overlay: host networking, for a from-scratch Linux deploy.
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
#   # LiveKit inside Docker too (skip native), on Linux only:
#   docker compose --profile docker-livekit -f docker-compose.yml -f docker-compose.host.yml up -d
#
# LINUX ONLY. Host networking is a Linux kernel feature; on Docker Desktop for
# macOS it binds inside the VM and nothing is reachable from the host (verified
# earlier: a container serving on :18080 with --network host is unreachable
# from macOS). On macOS use the base docker-compose.yml (bridge + service-name
# DNS) with LiveKit native via ./start.sh instead.
#
# WHY HOST NETWORKING HERE
# The base file's bridge networking is exactly what makes LiveKit need to run
# natively (see the `livekit` service comment in docker-compose.yml): under
# bridge networking, no single IP that LiveKit advertises as its ICE candidate
# is reachable by both an external browser and the in-Docker agent. Host
# networking removes that split entirely — every container shares the host's
# network stack, so LiveKit can run IN Docker here and still advertise a real,
# externally-reachable address.
#
# With host networking there is no port mapping and no service-name DNS, so
# every cross-service address collapses to localhost — which is what each
# service's own .env already expects.

services:
  redis:
    network_mode: host
    ports: !reset []

  keycloak:
    network_mode: host
    ports: !reset []
    # Host networking can't remap 8180->8080, so Keycloak must listen on 8180
    # directly. nest's KEYCLOAK_URL below matches.
    command: start-dev --http-port=8180

  elasticmq:
    network_mode: host
    ports: !reset []

  minio:
    network_mode: host
    ports: !reset []

  minio-init:
    network_mode: host
    environment:
      MINIO_URL: http://localhost:9000

  livekit:
    network_mode: host
    ports: !reset []
    command: >
      livekit-server --config /app/livekit/livekit.yaml
      --redis-host localhost:6379

  algojobs-service:
    network_mode: host
    ports: !reset []
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      REDIS_URL: redis://localhost:6379/0
      PROCTOR_API_URL: ws://localhost:8080/ws/proctor

  apex:
    network_mode: host
    ports: !reset []
    environment:
      SQS_ENDPOINT_URL: http://localhost:9324
      S3_ENDPOINT_URL: http://localhost:9000
      SQS_USER_SIGNUP_URL: http://localhost:9324/000000000000/algoapex-user-signup.fifo
      SQS_TEST_COMPLETED_URL: http://localhost:9324/000000000000/algoapex-test-completed.fifo
      SQS_EVALUATION_COMPLETED_URL: http://localhost:9324/000000000000/algoapex-evaluation-completed.fifo
      SQS_QUESTION_GENERATION_CRON_URL: http://localhost:9324/000000000000/algoapex-question-generation-cron.fifo

  personalized:
    network_mode: host
    ports: !reset []

  nest:
    network_mode: host
    ports: !reset []
    environment:
      REDIS_HOST: localhost
      KEYCLOAK_URL: http://localhost:8180
      PYTHON_SERVICE_URL: http://localhost:8000/api/v1
      PYTHON_PERSONALIZED_SERVICE: http://localhost:8070
      ALGOAPEX_API_URL: http://localhost:8001/v1
      SQS_ENDPOINT_URL: http://localhost:9324
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      SQS_USER_SIGNUP_URL: http://localhost:9324/000000000000/algoapex-user-signup.fifo
      SQS_TEST_COMPLETED_URL: http://localhost:9324/000000000000/algoapex-test-completed.fifo
      SQS_EVALUATION_COMPLETED_URL: http://localhost:9324/000000000000/algoapex-evaluation-completed.fifo

  frontend:
    network_mode: host
    ports: !reset []
    environment:
      BACKEND_API_URL: http://localhost:5001
      INTERNAL_API_BASE: http://localhost:5001

  agent-server:
    network_mode: host
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      PROCTOR_API_URL: ws://localhost:8080/ws/proctor
