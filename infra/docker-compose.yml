services:
  redis:
    image: redis:7-alpine
    container_name: algojob-infra-redis
    ports:
      - '6379:6379'
    volumes:
      - infra_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: algojob-infra-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
    ports:
      # Moved off 8080 — algojob-proctoring-mise owns that port natively.
      - '8180:8080'
    volumes:
      - infra_keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n" >&3 && head -1 <&3 | grep -q "200"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: algojob-infra-elasticmq
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    ports:
      - '9324:9324'
      - '9325:9325'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{}' --header='X-Amz-Target: AmazonSQS.ListQueues' --header='Content-Type: application/x-amz-json-1.0' http://localhost:9324/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  infra_redis_data:
    driver: local
  infra_keycloak_data:
    driver: local
