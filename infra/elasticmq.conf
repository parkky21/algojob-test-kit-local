include classpath("application.conf")

// host = "*" reflects whatever Host header the request came in on, so the
// same server answers correctly whether it's reached as elasticmq:9324
// (from inside this compose project) or host.docker.internal:9324 (from
// nest's separate compose project) — verified: GetQueueUrl/ListQueues
// return a QueueUrl built from the request's Host header, and SendMessage/
// ReceiveMessage only look at the final path segment to pick the queue, so
// routing works either way regardless of which hostname is in QueueUrl.
node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

rest-stats {
    enabled = true
    bind-port = 9325
    bind-hostname = "0.0.0.0"
}

// Queue names must keep the literal ".fifo" suffix — apex's publisher.py
// branches on `queue_url.endswith(".fifo")` to attach MessageGroupId /
// MessageDeduplicationId, and nest's producer always sends those FIFO
// params (ElasticMQ rejects them against a non-FIFO queue).
queues {
    "algoapex-user-signup.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    "algoapex-test-completed.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    "algoapex-evaluation-completed.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    "algoapex-question-generation-cron.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    "algoaptitude-user-signup.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    "algoaptitude-test-completed.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    "algoaptitude-evaluation-completed.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
    // nest's own email dispatch queue (src/email). Retries are driven by nest
    // (5 send attempts with backoff); the DLQ is only a backstop for messages
    // whose handler keeps crashing, hence the higher receive count.
    "algojob-email-dispatch.fifo" {
        fifo = true
        contentBasedDeduplication = false
        defaultVisibilityTimeout = 120 seconds
        deadLettersQueue {
            name = "algojob-email-dispatch-dlq.fifo"
            maxReceiveCount = 10
        }
    }
    "algojob-email-dispatch-dlq.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
}
